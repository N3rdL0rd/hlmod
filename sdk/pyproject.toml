[project]
name = "hlmod-sdk"
version = "0.1.0"
description = "Install hlmod, discover registered installs, and scaffold mod projects for them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.5",
]

[project.scripts]
hlmod-sdk = "hlmod_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hlmod_sdk"]
